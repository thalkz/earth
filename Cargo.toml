[package]
name = "earth"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0"
winit = { version = "0.30", features = ["android-native-activity"] }
env_logger = "0.10"
log = "0.4"
wgpu = "30.0"
pollster = "0.3"
bytemuck = "1.25.2"
glam = { version = "0.29", features = ["bytemuck"] }
image = { version = "0.24", default-features = false, features = ["jpeg", "tiff"] }
tiff = "0.9"
rayon = "1.10"

[profile.dev.package."*"]
opt-level = 3

[profile.dev.build-override]
opt-level = 3

