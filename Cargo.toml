[package]
name = "earth"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
winit = { version = "0.30", features = ["android-native-activity"] }
env_logger = "0.10"
log = "0.4"
wgpu = "30.0"
pollster = "0.3"
bytemuck = "1.25.2"
glam = { version = "0.29", features = ["bytemuck"] }
tobj = { version = "4.0.5", default-features = false, features = ["futures"] }
futures = "0.3.34"
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }


[build-dependencies]
anyhow = "1.0"
fs_extra = "1.2"
glob = "0.3"
image = { version = "0.24", default-features = false, features = ["png"] }
bytemuck = "1.25.2"
